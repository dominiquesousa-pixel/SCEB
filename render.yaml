services:
  - type: web
    name: sceb
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix backend ci && npm run build && npm --prefix backend run build
    startCommand: npm --prefix backend run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sceb-db
          property: connectionString
      - key: DATABASE_URL_UNPOOLED
        fromDatabase:
          name: sceb-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: sceb-db
    databaseName: sceb
    user: sceb
    plan: free
